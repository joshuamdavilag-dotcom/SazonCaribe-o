services:
  - type: web
    name: sazon-caribeno
    runtime: python
    pythonVersion: "3.12"
    buildCommand: PIP_ONLY_BINARY=1 pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthcheck
    # Persistent Disk para SQLite (1 GB gratis)
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      # SQLite config
      - key: SQLITE_PATH
        value: "/opt/render/project/src/data/sazon_caribeno.db"
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: CORS_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "525600"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "300"
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "900"
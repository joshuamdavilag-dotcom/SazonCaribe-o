services:
  - type: web
    name: sazon-caribeno
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install --only-binary=pydantic-core,pydantic,cryptography,bcrypt,python-jose -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthcheck
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: SECRET_KEY
        sync: false
      - key: HARCA27_PASSWORD
        sync: false
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: CORS_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "525600"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "300"
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "900"
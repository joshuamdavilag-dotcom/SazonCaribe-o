services:
  - type: web
    name: sazon-caribeno
    runtime: python
    pythonVersion: "3.12"
    buildCommand: PIP_ONLY_BINARY=1 pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthcheck
    envVars:
      # PostgreSQL: Render inyecta DATABASE_URL al vincular la base de datos.
      # Si no existe, la app usa SQLite local (solo desarrollo).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: CORS_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "525600"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "300"
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "900"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      # Ruta pública de la Carta Digital. Slug aleatorio con formato de ID de
      # Render (web-<20 letras y números>) para que la URL del menú no muestre
      # el nombre del negocio. Generar uno nuevo:
      #   python -m app.core.slug
      # Los QR viejos (/carta) siguen funcionando: se redirigen a esta ruta.
      - key: CARTA_RUTA_PUBLICA
        value: "/web-3qm6g6x14ofgqac3t97t"

databases:
  - name: sazon-caribeno-db
    databaseName: sazon_caribeno
    user: sazon_user
    plan: free

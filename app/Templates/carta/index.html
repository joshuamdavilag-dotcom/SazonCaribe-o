<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b400c">
  <meta name="description" content="Carta digital de Sazón Caribeño: mariscos frescos y recetas tradicionales en Diriamba.">
  <title>Sazón Caribeño — Menú</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b400c'/%3E%3Cpath d='M6 20c3-3 5 3 8 0s5 3 8 0 4 2 4 2' fill='none' stroke='%23F1E246' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="paginas/01.webp">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="cabecera">
    <span class="marca">SAZÓN CARIBEÑO</span>
    <span class="separador"></span>
    <span class="lema">Cocina del Caribe</span>
  </header>

  <main class="escena">
    <button id="btn-zoom" class="btn-zoom" type="button" aria-label="Ampliar la página para leer mejor" title="Ampliar la página" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M16 16 L21 21" />
        <path d="M11 8.5 V13.5 M8.5 11 H13.5" />
      </svg>
      <span>Ampliar</span>
    </button>

    <div class="libro-marco">
      <div id="libro" class="libro" data-paginas="11" aria-label="Menú digital, libro de páginas"></div>
    </div>

    <div id="cargando" class="cargando">
      <div class="spinner"></div>
      <p>Preparando el menú…</p>
    </div>
  </main>

  <footer class="controles">
    <button id="btn-prev" class="flecha" aria-label="Página anterior" title="Página anterior (←)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" /></svg>
    </button>

    <div class="progreso">
      <span id="pagina-actual">1</span>
      <span class="barra"><i id="barra-progreso"></i></span>
      <span id="pagina-total">1</span>
    </div>

    <button id="btn-next" class="flecha" aria-label="Página siguiente" title="Página siguiente (→)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" /></svg>
    </button>
  </footer>

  <p class="pista">Arrastra la esquina de la hoja · usa ← → · toca <b>Ampliar</b> para leer de cerca</p>

  <div id="visor" class="visor" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Página ampliada del menú">
    <div class="visor-barra">
      <span id="visor-titulo" class="visor-titulo">Página 1</span>
      <button id="visor-cerrar" class="visor-btn" type="button" aria-label="Cerrar y volver al libro" title="Cerrar (Esc)">✕</button>
    </div>

    <div id="visor-lienzo" class="visor-lienzo">
      <img id="visor-img" class="visor-img" alt="" draggable="false">
    </div>

    <div class="visor-pie">
      <button id="visor-anterior" class="visor-btn" type="button" aria-label="Página anterior">‹</button>
      <button id="visor-menos" class="visor-btn" type="button" aria-label="Alejar">−</button>
      <button id="visor-reset" class="visor-btn visor-btn-texto" type="button" aria-label="Tamaño normal">100%</button>
      <button id="visor-mas" class="visor-btn" type="button" aria-label="Acercar">+</button>
      <button id="visor-siguiente" class="visor-btn" type="button" aria-label="Página siguiente">›</button>
    </div>
  </div>


  <script src="vendor/page-flip.browser.js"></script>
  <script src="js/menu-libro.js"></script>
</body>
</html>
